name: Shopping Cart Unit Tests
on: push 

jobs:
  test:
    runs-on: ubuntu-latest 

    steps: 
      - name: Checkout repository code
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest #install pytest

      - name: Run unit tests
        run: python -m pytest tests/ #Rus pytest
