name: Shopping Cart Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**" #any file in src
      - "tests/**" #any files in tests
      - "pytest.ini"
      - ".github/workflows/carttest.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/carttest.yml"
  workflow_dispatch: # manual "Run workflow" button for on-demand runs

concurrency: # run the latest test on the latest codes
  #group is just a name tag so GitHub can recognise runs for the same branch or PR and cancel the older one
  group: ${{ github.workflow }}-${{ github.ref }} #branch or pr being tested
  cancel-in-progress: true
#allow old test run to stopped and new run to start

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest -v
